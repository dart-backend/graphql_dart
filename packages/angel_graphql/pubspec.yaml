name: angel3_graphql
version: 10.0.0
description: The fastest and easiest way to get a GraphQL backend in Dart, using Angel3.
homepage: https://angel3-framework.web.app/
repository: https://github.com/dart-backend/graphql_dart/
issue_tracker: https://github.com/dart-backend/graphql_dart/issues

environment:
  sdk: '>=3.13.0 <4.0.0'

resolution: workspace

dependencies:
  angel3_file_service: ^10.0.0
  angel3_framework: ^10.0.0
  angel3_container: ^10.0.0
  angel3_websocket: ^10.0.0
  angel3_validate: ^10.0.0
  graphql_parser2: ^8.0.0
  graphql_schema2: ^8.0.0
  graphql_server2: ^9.0.0
  http_parser: ^4.0.0
  stream_channel: ^2.1.0
  web_socket_channel: ^3.0.0
  collection: ^1.17.0

dev_dependencies:
  angel3_serialize: ^10.0.0
  angel3_serialize_generator: ^10.0.0
  build_runner: ^2.7.0
  graphql_generator2: ^8.0.0
  file: ^7.0.0
  logging: ^1.2.0
  lints: ^6.0.0
  test: ^1.24.0
